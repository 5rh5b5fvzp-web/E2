# ============================================================
# 数据源默认配置（提交到 Git）
# 真实口令不要写在这里：
#   1. 复制 jdbc-local.properties.example 为 jdbc-local.properties；
#   2. 在 jdbc-local.properties 中填写本机账号口令（该文件已被 .gitignore 忽略）；
#   3. 也可以通过环境变量 DB_USERNAME / DB_PASSWORD 注入。
# ============================================================
jdbc.driver=com.mysql.cj.jdbc.Driver
jdbc.url=jdbc:mysql://localhost:3306/ssm_emp_mis?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
jdbc.username=${DB_USERNAME:root}
# 口令不在此处声明：由 jdbc-local.properties（本机，已忽略）或环境变量 DB_PASSWORD 提供，
# 避免 ${DB_PASSWORD:} 空值覆盖本机配置文件中的真实口令。
